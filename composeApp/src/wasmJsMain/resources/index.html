<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Turn any image into stencil layers, at any size.">
    <title>Stencil Artist</title>
    <style>
        html, body { margin: 0; height: 100%; background: #000; color: #e6e6e6; overflow: hidden;
            font-family: system-ui, sans-serif; }
        /* Shown until the app has drawn its first frame, and all there is if it cannot start. */
        #loading { position: fixed; inset: 0; display: grid; place-items: center; letter-spacing: 0.2em;
            text-transform: uppercase; font-size: 0.8rem; color: #9a9a9a; }
    </style>
</head>
<body>
<div id="loading">Stencil Artist</div>
<noscript>Stencil Artist needs JavaScript and WebAssembly.</noscript>
<script src="stencil-artist.js"></script>
</body>
</html>
